# One command brings up the whole stack:  docker compose up --build
#
# Ollama is expected on the host by default -- it holds the models you already pulled,
# and on a GPU box it is the copy with the drivers. To run it in a container instead:
#   docker compose -f compose.yaml -f compose.ollama.yaml up --build

name: sarathi

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      # host.docker.internal is mapped to the host gateway below.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      CORS_ORIGINS: http://localhost:${WEB_PORT:-3000},http://127.0.0.1:${WEB_PORT:-3000}
    env_file:
      # Carries ADMIN_TOKEN. Absent on a fresh clone, and admin routes then return 503.
      - path: .env
        required: false
    extra_hosts:
      # Linux has no built-in host.docker.internal; this supplies it.
      - "host.docker.internal:host-gateway"
    volumes:
      # Writable: the admin upload route adds files here, and they should survive.
      - ./docs:/app/docs
      - index:/app/.chroma
      - cache:/app/.cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      # Generous: the first boot builds the vector index before uvicorn binds.
      start_period: 300s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        # Baked into the client bundle, so it must be reachable from the browser --
        # the published port on the host, never the compose service name.
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  index:
  cache:
