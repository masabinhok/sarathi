[project]
name = "ioe"
version = "0.1.0"
description = "Sarathi -- an IOE entrance and admission assistant"
readme = "README.md"
authors = [
    { name = "Sabin Shrestha", email = "sabin.shrestha.er@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-chroma>=1.1.0",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "nepali-datetime>=1.0.8.5",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "ruff>=0.16.3",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
ioe = "ioe.main:main"
ioe-index = "ioe.rag:main"
ioe-notices = "ioe.notices:main"
ioe-extract = "ioe.extract:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
